name: garde

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: garde-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: compile
        run: python3 -m compileall -q garde.py tests
      - name: deny-gate tests
        run: python3 -m unittest discover -s tests -v
      - name: allow fixture
        run: python3 garde.py deny --carte tests/fixtures/allow-quelle-os.json
      - name: red fixtures must deny
        run: |
          set -e
          shopt -s nullglob
          cartes=(examples/deny-*.json)
          test "${#cartes[@]}" -ge 8
          for carte in "${cartes[@]}"; do
            if python3 garde.py deny --carte "$carte" >/dev/null; then
              echo "$carte passed the gate"
              exit 1
            fi
            echo "deny ok: $carte"
          done
      - name: scan this repo
        run: python3 garde.py scan --root .
